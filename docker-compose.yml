services:

  postgres:
    image: postgres:15-alpine
    container_name: support_ticket_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: support_ticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_ticket"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: support_ticket_backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/support_ticket
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: support_ticket_frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      API_INTERNAL_URL: http://backend:8080

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data: