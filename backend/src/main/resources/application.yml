server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/support_ticket}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/support_ticket}
  messages:
    basename: messages
    encoding: UTF-8

jwt:
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-key-must-be-32b!!}
  ttl-ms: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
