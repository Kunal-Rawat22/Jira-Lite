spring:
  datasource:
    url: jdbc:h2:mem:tickets;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    mongodb:
      port: 0

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.12

jwt:
  secret: test-jwt-secret-key-must-be-32-chars!
  ttl-ms: 1800000
